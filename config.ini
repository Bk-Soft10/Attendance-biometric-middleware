[odoo]
# Odoo instance URL (this deployment)
url = https://www.samtia.com/
# Database name — required here because the host serves multiple databases.
db = adv-photonix-main-23293882
# Transport: json2 (Odoo 19 JSON-2, USER API key as bearer)  |  custom (device API key)
transport = json2
# json2  -> a USER API key (Odoo: Preferences > Account Security > New API Key);
#           the user must have HR Attendance create rights.
# custom -> any active device's API key (Odoo: Biometric > Devices > device form).
api_key = REPLACE_WITH_YOUR_API_KEY
# auto_discover = true: pull the device list (IP/port/code/timezone) from Odoo and
# sync EVERY active device in parallel. Leave the [device] section blank.
auto_discover = true
# device_code: only used when auto_discover = false (single-device mode)
device_code =
timeout = 30

[device]
# Ignored when auto_discover = true (values come from Odoo). Kept for
# single-device mode only. On site the devices are:
#   Main Gate  - iWEB F18    192.168.2.12 : 4370
#   Back Door  - BIOSENSE-T  192.168.2.49 : 2000
host =
port = 4370
password = 0
type = auto

[sync]
# Poll every N minutes (the daemon repeats this interval)
interval_minutes = 5
batch_size = 100
# NEVER clear device logs automatically in production
clear_after_sync = false
# Only fetch punches from the last N hours each cycle
since_hours = 24
retry_attempts = 3
retry_delay_seconds = 10

[logging]
level = INFO
file =
